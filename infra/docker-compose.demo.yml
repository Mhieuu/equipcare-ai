name: equipcare-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-equipcare}
      POSTGRES_USER: ${DB_USER:-equipcare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-equipcare_pwd}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-equipcare} -d ${DB_NAME:-equipcare}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy Prisma migration 1 lần trước khi api start
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["pnpm", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Seed dữ liệu demo 1 lần sau migrate (idempotent, dùng upsert với UUID cố định)
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["pnpm", "db:seed"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
    env_file:
      - path: ../.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      API_PORT: 3001
      NODE_ENV: production
    env_file:
      - path: ../.env
        required: false
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    env_file:
      - path: ../.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
