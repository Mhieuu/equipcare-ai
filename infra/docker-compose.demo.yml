name: equipcare-demo

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-equipcare}
      POSTGRES_USER: ${DB_USER:-equipcare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-equipcare_pwd}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-equipcare} -d ${DB_NAME:-equipcare}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-16T17-43-14Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy Prisma migration 1 lần trước khi api/worker start
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["pnpm", "db:migrate:deploy"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Seed dữ liệu demo 1 lần sau migrate (idempotent, dùng upsert với UUID cố định)
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["pnpm", "db:seed"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Tạo bucket MinIO 1 lần ở chế độ private
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do sleep 1; done &&
        /usr/bin/mc mb --ignore-existing -p local/${S3_BUCKET:-equipcare-files} &&
        echo 'MinIO bucket ${S3_BUCKET:-equipcare-files} ready (private)'
      "
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-equipcare-files}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      API_PORT: 3001
      NODE_ENV: production
    env_file: ../.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    env_file: ../.env
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-equipcare}:${DB_PASSWORD:-equipcare_pwd}@postgres:5432/${DB_NAME:-equipcare}
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_REQUEST_TIMEOUT_MS: "45000"
      NODE_ENV: production
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
